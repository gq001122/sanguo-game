<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>三国人生模拟器 V4.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        #status-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent);
            z-index: 100;
        }

        #player-status {
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: #FFD700;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        #player-status span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            background: #111;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            border-radius: 0;
        }

        #background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease;
        }

        /* 人物立绘容器 - 层级在背景之上、对话框之下 */
        #character-sprite-container {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 70%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            pointer-events: none;
            z-index: 1;
            /* 底部渐隐遮罩 */
            -webkit-mask-image: linear-gradient(to bottom, black calc(100% - 10px), transparent 100%);
            mask-image: linear-gradient(to bottom, black calc(100% - 10px), transparent 100%);
        }

        #character-sprite {
            max-height: 100%;
            max-width: 60%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.5));
        }

        #character-sprite.visible {
            opacity: 1;
        }

        #dialogue-box {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85) 20%);
            padding: 60px 40px calc(30px + env(safe-area-inset-bottom));
            padding-bottom: calc(30px + env(safe-area-inset-bottom));
            min-height: 200px;
            z-index: 10;
        }

        #character-name {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        #dialogue-text {
            color: #fff;
            font-size: 1.1em;
            line-height: 1.8;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            min-height: 60px;
        }

        #click-indicator {
            position: absolute;
            bottom: 15px;
            right: 30px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        #choices-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
        }

        .choice-btn {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 15px 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 5px;
            min-width: 300px;
            text-align: center;
        }

        .choice-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.05);
        }

        #title-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('images/backgrounds/bg_start.jpg') center center / cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        
        /* 标题界面遮罩 - 确保文字可读 */
        #title-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        #title-screen h1 {
            color: #fff;
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
        }

        #title-screen p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 50px;
            font-size: 1.1em;
        }

        #start-btn {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            padding: 15px 60px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 30px;
        }

        #start-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
            transform: scale(1.1);
        }

        #ending-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 40px;
            overflow: hidden;
        }

        #ending-screen.show {
            display: flex;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #ending-image-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 16 / 9;
            margin-bottom: 30px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        #ending-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #ending-type {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        #ending-title {
            color: #fff;
            font-size: 2.2em;
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        #ending-summary {
            color: rgba(255, 255, 255, 0.85);
            font-size: 1em;
            line-height: 1.9;
            max-width: 600px;
            text-align: center;
            margin-bottom: 35px;
            padding: 0 20px;
        }

        #restart-btn {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            padding: 12px 40px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 25px;
        }

        #restart-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
        }

        #ending-type.good { color: #FFD700; }
        #ending-type.normal { color: #87CEEB; }
        #ending-type.bad { color: #FF6B6B; }

        #ending-title.good { color: #FFD700; }
        #ending-title.normal { color: #87CEEB; }
        #ending-title.bad { color: #FF6B6B; }

        .fade-out {
            opacity: 0 !important;
        }

        .shake {
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .flash {
            animation: flash 0.3s ease;
        }

        @keyframes flash {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(2); }
        }

        /* 响应式适配 - 平板 */
        @media (max-width: 768px) {
            #dialogue-box {
                padding: 40px 20px 20px;
                min-height: 150px;
            }
            
            #character-name {
                font-size: 1em;
            }
            
            #dialogue-text {
                font-size: 0.95em;
            }
            
            .choice-btn {
                padding: 12px 30px;
                font-size: 1em;
                min-width: 250px;
            }
            
            #title-screen h1 {
                font-size: 2em;
            }

            #character-sprite-container {
                bottom: 150px;
                height: 60%;
            }

            #character-sprite {
                max-width: 50%;
            }
        }

        /* 响应式适配 - 手机 */
        @media (max-width: 480px) {
            body {
                align-items: flex-start;
            }

            #game-container {
                max-width: 100%;
                box-shadow: none;
                border-radius: 0;
            }

            #dialogue-box {
                padding: 30px 15px calc(15px + env(safe-area-inset-bottom));
                min-height: 130px;
            }
            
            #character-name {
                font-size: 0.95em;
                margin-bottom: 8px;
            }
            
            #dialogue-text {
                font-size: 0.9em;
                line-height: 1.7;
                min-height: 50px;
            }

            #click-indicator {
                font-size: 0.8em;
                bottom: 10px;
                right: 15px;
            }
            
            .choice-btn {
                padding: 12px 20px;
                font-size: 0.95em;
                min-width: 200px;
                max-width: 90vw;
            }

            #choices-container {
                gap: 12px;
                width: 90%;
            }
            
            #title-screen h1 {
                font-size: 1.6em;
                padding: 0 20px;
                text-align: center;
            }

            #title-screen p {
                font-size: 0.95em;
                padding: 0 20px;
                text-align: center;
                margin-bottom: 40px;
            }

            #start-btn {
                padding: 12px 50px;
                font-size: 1.1em;
            }

            #character-sprite-container {
                bottom: 130px;
                height: 55%;
            }

            #character-sprite {
                max-width: 45%;
            }

            /* 结局画面移动端适配 */
            #ending-screen {
                padding: 20px 15px;
            }

            #ending-image-container {
                max-width: 100%;
                margin-bottom: 20px;
            }

            #ending-type {
                font-size: 0.8em;
                letter-spacing: 3px;
            }

            #ending-title {
                font-size: 1.5em;
                margin-bottom: 15px;
            }

            #ending-summary {
                font-size: 0.9em;
                line-height: 1.8;
                margin-bottom: 25px;
                padding: 0 10px;
            }

            #restart-btn {
                padding: 10px 35px;
                font-size: 0.95em;
            }
        }

        /* 竖屏模式特殊处理 */
        @media (max-aspect-ratio: 4/3) {
            #game-container {
                aspect-ratio: auto;
                height: 100vh;
                height: 100dvh;
                max-height: 100vh;
            }

            #background {
                object-position: center center;
            }

            #character-sprite-container {
                height: 45%;
            }

            #character-sprite {
                max-width: 70%;
                max-height: 100%;
            }

            #dialogue-box {
                padding-bottom: calc(30px + env(safe-area-inset-bottom));
                min-height: 25vh;
                max-height: 35vh;
            }

            #ending-screen {
                justify-content: flex-start;
                padding-top: calc(10vh + env(safe-area-inset-top));
                padding-bottom: calc(20px + env(safe-area-inset-bottom));
                overflow-y: auto;
            }

            #ending-image-container {
                flex-shrink: 0;
            }
        }

        /* 超小屏幕 */
        @media (max-width: 360px) {
            #title-screen h1 {
                font-size: 1.4em;
            }

            #dialogue-text {
                font-size: 0.85em;
            }

            .choice-btn {
                padding: 10px 15px;
                font-size: 0.9em;
                min-width: 180px;
            }

            #ending-title {
                font-size: 1.3em;
            }

            #ending-summary {
                font-size: 0.85em;
            }
        }

        /* 横屏手机优化 */
        @media (max-height: 500px) and (orientation: landscape) {
            #dialogue-box {
                min-height: 100px;
                padding: 25px 20px 15px;
            }

            #dialogue-text {
                min-height: 40px;
            }

            #character-sprite-container {
                bottom: 50px;
                height: 60%;
            }

            #title-screen h1 {
                font-size: 1.8em;
                margin-bottom: 10px;
            }

            #title-screen p {
                margin-bottom: 20px;
            }

            #ending-screen {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                gap: 20px;
                padding: 15px;
            }

            #ending-image-container {
                max-width: 40%;
                margin-bottom: 0;
            }

            #ending-summary {
                max-width: 50%;
            }
        }

        /* 触摸设备优化 */
        @media (hover: none) and (pointer: coarse) {
            .choice-btn:hover {
                transform: none;
                background: rgba(0, 0, 0, 0.8);
                border-color: rgba(255, 255, 255, 0.3);
            }

            .choice-btn:active {
                background: rgba(255, 255, 255, 0.15);
                border-color: rgba(255, 255, 255, 0.8);
                transform: scale(0.98);
            }

            #start-btn:hover {
                transform: none;
                background: transparent;
                border-color: rgba(255, 255, 255, 0.5);
            }

            #start-btn:active {
                background: rgba(255, 255, 255, 0.1);
                border-color: #fff;
                transform: scale(0.98);
            }

            #restart-btn:hover {
                background: transparent;
            }

            #restart-btn:active {
                background: rgba(255, 255, 255, 0.1);
                border-color: #fff;
            }
        }

        /* 安全区域适配（刘海屏等） */
        @supports (padding: env(safe-area-inset-bottom)) {
            #dialogue-box {
                padding-bottom: calc(15px + env(safe-area-inset-bottom));
            }

            #ending-screen {
                padding-bottom: calc(20px + env(safe-area-inset-bottom));
            }
        }
    
        /* 音频控制 */
        #audio-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .audio-btn {
            background: transparent;
            border: none;
            color: #FFD700;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.2s ease;
        }

        .audio-btn:hover {
            transform: scale(1.1);
        }

        .audio-btn:active {
            transform: scale(0.95);
        }

        #volume-slider-container {
            width: 80px;
            display: flex;
            align-items: center;
        }

        #volume-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            outline: none;
        }

        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #FFD700;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        #volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        #volume-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #FFD700;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
    
        /* 加载进度条 */
        #loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 40px;
            padding: 20px 40px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }

        #loading-text {
            color: #FFD700;
            font-size: 1.1em;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }

        #loading-progress {
            width: 300px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        #loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #FFD700, #FFA500, #FFD700);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        #loading-percent {
            color: #FFD700;
            font-size: 1em;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }
    
        /* 加载进度条响应式适配 */
        @media (max-width: 480px) {
            #loading-container {
                width: 90%;
                padding: 15px 20px;
                margin-top: 30px;
            }
            
            #loading-progress {
                width: 100%;
            }
            
            #loading-text {
                font-size: 0.95em;
            }
            
            #loading-percent {
                font-size: 0.9em;
            }
        }
    </style>

    <script>
        // 游戏数据（由生成脚本注入）
        
        // 更新进度条
        function updateProgress(percent, text) {
            console.log(`📊 进度: ${percent}% - ${text}`);
            
            // 更新状态显示面板
            const statusPanel = document.getElementById('loading-status');
            if (statusPanel) {
                const time = new Date().toLocaleTimeString();
                statusPanel.innerHTML += `<div>[${time}] ${percent}% - ${text}</div>`;
                statusPanel.scrollTop = statusPanel.scrollHeight;
            }
            
            const loadingBar = document.getElementById('loading-bar');
            const loadingPercent = document.getElementById('loading-percent');
            const loadingText = document.getElementById('loading-text');
            
            if (loadingBar) {
                loadingBar.style.width = percent + '%';
            } else {
                console.error('❌ loading-bar元素未找到');
            }
            
            if (loadingPercent) {
                loadingPercent.textContent = percent + '%';
            } else {
                console.error('❌ loading-percent元素未找到');
            }
            
            if (loadingText) {
                if (text) loadingText.textContent = text;
            } else {
                console.error('❌ loading-text元素未找到');

        // 加载场景
        function updateStatusBar() {

            }
            if (factionEl) {
                const factionText = gameState.isLord ? '君主' : 
                                     gameState.lord ? `效忠${gameState.lord}` : '独立';
                factionEl.textContent = `阵营: ${gameState.faction || '无'} | ${factionText}`;
            }

        function loadScene(sceneId) {
            const scene = GAME_DATA.scenes.find(s => s.id === sceneId);
            if (!scene) {
                console.error('Scene not found:', sceneId);
                return;
            }

            currentSceneId = sceneId;

            // 切换背景音乐
            bgmSystem.switchBGM(sceneId);
            currentDialogueIndex = 0;

            // 设置背景
            if (BACKGROUNDS[scene.background]) {
                background.src = BACKGROUNDS[scene.background];
            }

            // 清空选项
            choicesContainer.innerHTML = '';
            
            // 处理setup字段，初始化或更新玩家属性
            if (scene.setup) {
                if (scene.setup.martial || scene.setup.force) {
                    gameState.martial = scene.setup.martial || scene.setup.force || 5;
                }
                if (scene.setup.intel) gameState.intel = scene.setup.intel;
                if (scene.setup.charm) gameState.charm = scene.setup.charm;
                if (scene.setup.wealth) gameState.wealth = scene.setup.wealth;
                if (scene.setup.constitution) gameState.constitution = scene.setup.constitution;
                if (scene.setup.luck) gameState.luck = scene.setup.luck;
                if (scene.setup.skills) gameState.skills = scene.setup.skills;
                if (scene.setup.identity) gameState.identity = scene.setup.identity;
            }
            
            // 更新状态栏
            updateStatusBar();
            
            // 如果没有对话但有战斗事件，直接处理战斗
            if (!scene.dialogues || scene.dialogues.length === 0) {
                handleSceneEnd(scene);
            } else {
                clickIndicator.style.display = 'block';
                // 显示第一条对话
                showDialogue();
            }
        }

        // 显示对话
        function showDialogue() {
            const scene = GAME_DATA.scenes.find(s => s.id === currentSceneId);
            if (!scene) return;

            if (currentDialogueIndex >= scene.dialogues.length) {
                // 对话结束，显示选项或跳转
                handleSceneEnd(scene);
                return;
            }

            const dialogue = scene.dialogues[currentDialogueIndex];
            const charName = characterNames[dialogue.character] || '';
            const charColor = characterColors[dialogue.character] || '#FFFFFF';

            // 设置角色名称
            if (dialogue.character === 'narrator') {
                characterName.textContent = '';
            } else {
                characterName.textContent = charName;
                characterName.style.color = charColor;
            }

            // 显示角色立绘
            showCharacterSprite(dialogue.character);

            // 打字机效果显示文本
            typeText(dialogue.text);

            // 应用特效
            if (dialogue.effect) {
                applyEffect(dialogue.effect);
            }
        }

        // 显示角色立绘（渐入渐出效果）
        function showCharacterSprite(characterId) {
            const sprite = document.getElementById('character-sprite');
            const spriteName = characterId;
            
            if (spriteName && SPRITES[spriteName]) {
                // 有立绘的角色 - 渐入显示
                sprite.src = SPRITES[spriteName];
                sprite.classList.add('visible');
            } else {
                // 无立绘（旁白、主角等） - 渐出隐藏
                sprite.classList.remove('visible');
            }
        }

        // 打字机效果
        function typeText(text) {
            isAnimating = true;
            dialogueText.textContent = '';
            let index = 0;

            const interval = setInterval(() => {
                if (index < text.length) {
                    dialogueText.textContent += text[index];
                    index++;
                } else {
                    clearInterval(interval);
                    isAnimating = false;
                }
            }, 30);

            // 保存 interval 以便跳过
            dialogueText.dataset.interval = interval;
            dialogueText.dataset.fullText = text;
        }

        // 跳过打字效果
        function skipTypeText() {
            const interval = parseInt(dialogueText.dataset.interval);
            if (interval) {
                clearInterval(interval);
            }
            dialogueText.textContent = dialogueText.dataset.fullText || '';
            isAnimating = false;
        }

        // 应用特效
        function applyEffect(effect) {
            const container = document.getElementById('game-container');
            container.classList.remove('shake', 'flash');
            
            if (effect === 'shake') {
                container.classList.add('shake');
            } else if (effect === 'flash') {
                container.classList.add('flash');
            } else if (effect === 'fade') {
                background.classList.add('fade-out');
                setTimeout(() => background.classList.remove('fade-out'), 500);
            }
        }

        // 处理场景结束
        function handleSceneEnd(scene) {
            // 检查是否是结局
            if (scene.ending) {
                showEnding(scene.ending);
                return;
            }

            // 处理城池占领事件
            if (scene.cityConquest) {
                handleCityConquest(scene.cityConquest, scene.outcomes);
                return;
            }

            // 处理技能检定事件
            if (scene.skillCheck) {
                handleSkillCheck(scene.skillCheck, scene.outcomes);
                return;
            }

            // 处理战斗事件
            if (scene.battleEvent) {
                handleBattle(scene.battleEvent, scene.outcomes);
                return;
            }

            // 显示选项
            if (scene.choices && scene.choices.length > 0) {
                showChoices(scene.choices);
            } else if (scene.next) {
                // 自动跳转下一场景
                loadScene(scene.next);
            }
        }

        function handleBattle(battleEvent, outcomes) {
            // 计算战斗结果
            const playerForce = gameState.martial + (gameState.weapon || 0);
            const enemyForce = battleEvent.enemyForce;
            const random = Math.floor(Math.random() * 20) + 1;
            
            const playerTotal = playerForce * 10 + random;
            const enemyTotal = enemyForce * 10 + Math.floor(Math.random() * 20) + 1;
            
            const isWin = playerTotal > enemyTotal;
            
            // 显示战斗结果
            const resultText = isWin ? 
                `⚔️ 战斗胜利！你击败了${battleEvent.desc || '敌人'}` :
                `💀 战斗失败！你被${battleEvent.desc || '敌人'}击败`;
            
            // 更新对话显示
            characterName.textContent = '战斗';
            characterName.style.color = '#FF4500';
            clickIndicator.style.display = 'none';
            typeText(resultText);
            
            // 延迟后跳转
            setTimeout(() => {
                const nextSceneId = isWin ? outcomes.win : outcomes.lose;
                loadScene(nextSceneId);
            }, 2000);
        }

        function handleCityConquest(conquestEvent, outcomes) {
            const cityId = conquestEvent.city;
            const requiredForce = conquestEvent.force;
            const cityOwnership = GAME_DATA.cityOwnership || {};
            const cityData = cityOwnership[cityId];
            
            // 计算占领结果
            const playerForce = gameState.martial + (gameState.weapon || 0);
            const random = Math.floor(Math.random() * 20) + 1;
            const playerTotal = playerForce * 10 + random;
            const enemyTotal = requiredForce * 10 + Math.floor(Math.random() * 20) + 1;
            
            const isWin = playerTotal > enemyTotal;
            
            let resultText = '';
            
            if (isWin) {
                // 占领成功
                const cityName = cityData ? cityData.name : cityId;
                const oldOwner = cityData ? cityData.occupier : '未知';
                
                // 更新城池归属
                if (GAME_DATA.cityOwnership && cityId) {
                    GAME_DATA.cityOwnership[cityId] = {
                        owner: gameState.isLord ? '我' : gameState.lord || '我',
                        faction: gameState.faction || '我',
                        occupier: '我'
                    };
                }
                
                // 玩家占领城池
                if (!gameState.ownedCities.includes(cityId)) {
                    gameState.ownedCities.push(cityId);
                }
                
                // 如果没有都城，设置第一座城池为都城
                if (!gameState.capital) {
                    gameState.capital = cityId;
                }
                
                gameState.fame = (gameState.fame || 0) + 20;
                
                resultText = `🏰 攻占成功！\n\n你成功占领了${cityName}！\n原城主：${oldOwner}\n\n（点击继续）`;
            } else {
                resultText = `💥 攻占失败！\n\n${cityData ? cityData.name : cityId}守军顽强抵抗，你未能成功。\n\n（点击继续）`;
            }
            
            // 更新对话显示
            characterName.textContent = '城池占领';
            characterName.style.color = '#8B4513';
            clickIndicator.style.display = 'none';
            
            // 清空对话文本
            dialogueText.textContent = '';
            
            // 使用打字机效果显示结果
            let i = 0;
            const typeWriter = setInterval(() => {
                if (i < resultText.length) {
                    dialogueText.textContent += resultText.charAt(i);
                    i++;
                } else {
                    clearInterval(typeWriter);
                    
                    // 打字完成后添加点击事件跳转
                    const conquestHandler = () => {
                        gameState.showingYearReport = false;
                        document.removeEventListener('click', conquestHandler);
                        const nextSceneId = isWin ? outcomes.win : outcomes.lose;
                        console.log('跳转到场景:', nextSceneId);
                        loadScene(nextSceneId);
                    };
                    
                    // 延迟添加点击事件，避免立即触发
                    setTimeout(() => {
                        gameState.showingYearReport = true; // 标记显示中
                        document.addEventListener('click', conquestHandler);
                    }, 100);
                }
            }, 30);
        }

        function handleSkillCheck(skillCheck, outcomes) {
            const requiredSkill = skillCheck.skill;
            const dc = skillCheck.dc;
            
            // 检查玩家是否有该技能
            const hasSkill = gameState.skills && gameState.skills.includes(requiredSkill);
            
            let skillValue = 0;
            let resultText = '';
            let isWin = false;
            
            if (hasSkill) {
                // 根据技能类型计算技能值
                if (requiredSkill === 'sheshipu') {
                    skillValue = gameState.charm;
                } else if (requiredSkill === 'basic_fight' || requiredSkill === 'force') {
                    skillValue = gameState.martial;
                } else if (requiredSkill === 'huogong') {
                    skillValue = gameState.intel;
                } else {
                    skillValue = Math.floor((gameState.intel + gameState.charm) / 2);
                }
                
                // 加上随机值
                skillValue += Math.floor(Math.random() * 20) + 1;
                isWin = skillValue >= dc;
                
                if (isWin) {
                    resultText = `✨ 技能检定成功！${requiredSkill}（${skillValue} >= ${dc}）\n\n（点击继续）`;
                } else {
                    resultText = `❌ 技能检定失败！${requiredSkill}（${skillValue} < ${dc}）\n\n（点击继续）`;
                }
            } else {
                resultText = `❌ 你没有${requiredSkill}技能，无法完成此行动\n\n（点击继续）`;
                isWin = false;
            }
            
            // 更新对话显示
            characterName.textContent = '技能检定';
            characterName.style.color = '#9932CC';
            clickIndicator.style.display = 'block';
            
            // 清空对话文本
            dialogueText.textContent = '';
            
            // 使用打字机效果显示结果
            let i = 0;
            const typeWriter = setInterval(() => {
                if (i < resultText.length) {
                    dialogueText.textContent += resultText.charAt(i);
                    i++;
                } else {
                    clearInterval(typeWriter);
                    
                    // 标记为等待点击继续状态
                    gameState.skillCheckPending = true;
                    gameState.skillCheckNextScene = isWin ? outcomes.win : outcomes.lose;
                    isAnimating = false;
                }
            }, 30);
        }

        function showYearReport(year, nextSceneId) {
            // 设置显示播报标志
            gameState.showingYearReport = true;
            
            // 隐藏点击指示器
            clickIndicator.style.display = 'none';
            
            // 处理NPC随机事件
            const npcEvents = npcSystem.processNPCEvents(year);
            
            // 获取该年的历史事件
            const yearEvents = GAME_DATA.yearEvents || {};
            const eventText = yearEvents[year.toString()] || `公元${year}年，天下相对平静`;
            
            // 显示年份播报
            characterName.textContent = `📅 公元${year}年`;
            characterName.style.color = '#FFD700';
            
            // 构建播报文本
            let reportText = `【年终播报】

${eventText}`;
            
            // 添加NPC事件
            if (npcEvents && npcEvents.length > 0) {
                reportText += `

📜 天下风云：
`;
                npcEvents.forEach(event => {
                    reportText += event + `\n`;
                });
            }
            
            // 添加城池归属信息
            reportText += `

🏰 城池归属：`;
            reportText += npcSystem.getCityOwnershipText();
            
            reportText += `

（点击继续下一年）`;
            
            // 使用打字机效果显示
            dialogueText.textContent = '';
            let i = 0;
            const typeWriter = setInterval(() => {
                if (i < reportText.length) {
                    dialogueText.textContent += reportText.charAt(i);
                    i++;
                } else {
                    clearInterval(typeWriter);
                    
                    // 打字完成后添加点击事件跳转
                    const yearReportHandler = () => {
                        gameState.showingYearReport = false;
                        document.removeEventListener('click', yearReportHandler);
                        loadScene(nextSceneId);
                    };
                    
                    // 延迟添加点击事件，避免立即触发
                    setTimeout(() => {
                        document.addEventListener('click', yearReportHandler);
                    }, 100);
                }
            }, 30);
        }

        // 显示选项
        function showChoices(choices) {
            clickIndicator.style.display = 'none';
            choicesContainer.innerHTML = '';

            // 检查当前场景是否是地图探索（通过场景特征判断）
            const currentScene = GAME_DATA.scenes.find(s => s.id === currentSceneId);
            const isMapScene = currentScene && (currentScene.showMap === true || 
                           currentScene.id.includes('map') || 
                           currentScene.id.includes('explore') ||
                           currentScene.cityEvent);

            // 防止重复点击的标志
            let isProcessing = false;

            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choice.text;
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    
                    // 防止重复点击
                    if (isProcessing) return;
                    isProcessing = true;
                    
                    // 禁用所有按钮
                    const allButtons = choicesContainer.querySelectorAll('.choice-btn');
                    allButtons.forEach(button => button.disabled = true);
                    
                    // 如果是地图探索场景，不增加选择次数
                    if (!isMapScene) {
                        gameState.choiceCount++;
                        console.log(`选择次数: ${gameState.choiceCount}, 年份: ${gameState.currentYear}`);
                        
                        // 检查是否达到5次，需要增加年份
                        if (gameState.choiceCount % 5 === 0) {
                            gameState.currentYear++;
                            gameState.age++; // 年龄随年份增加
                            console.log(`年份增加: ${gameState.currentYear}`);
                            showYearReport(gameState.currentYear, choice.next);
                            return;
                        }
                    }
                    
                    loadScene(choice.next);
                });
                choicesContainer.appendChild(btn);
            });
        }

        // 显示结局
        function showEnding(ending) {
            const typeLabels = {
                'good': 'GOOD ENDING',
                'normal': 'NORMAL ENDING',
                'bad': 'BAD ENDING'
            };

            // 设置结局图片
            const endingImage = document.getElementById('ending-image');
            const endingImageContainer = document.getElementById('ending-image-container');
            if (ending.image && BACKGROUNDS[ending.image]) {
                endingImage.src = BACKGROUNDS[ending.image];
                endingImageContainer.style.display = 'block';
            } else {
                endingImageContainer.style.display = 'none';
            }

            // 设置结局类型标签
            endingType.textContent = typeLabels[ending.type] || 'ENDING';
            endingType.className = ending.type || '';
            
            // 设置结局标题
            endingTitle.textContent = ending.title;
            endingTitle.className = ending.type || '';
            
            // 设置结局总结
            const endingSummary = document.getElementById('ending-summary');
            if (ending.summary) {
                endingSummary.textContent = ending.summary;
                endingSummary.style.display = 'block';
            } else {
                endingSummary.style.display = 'none';
            }

            endingScreen.classList.add('show');
        }

        // 处理点击
        function handleClick(e) {
            // 如果在显示年终播报，不处理
            if (gameState.showingYearReport) return;
            
            // 处理技能检定后的点击继续
            if (gameState.skillCheckPending) {
                console.log('技能检定跳转到场景:', gameState.skillCheckNextScene);
                gameState.skillCheckPending = false;
                loadScene(gameState.skillCheckNextScene);
                return;
            }
            
            // 忽略选项点击
            if (e.target.classList.contains('choice-btn')) return;
            if (choicesContainer.children.length > 0) return;
            if (endingScreen.classList.contains('show')) return;
            if (titleScreen.style.display !== 'none') return;

            if (isAnimating) {
                // 跳过打字效果
                skipTypeText();
            } else {
                // 下一条对话
                currentDialogueIndex++;
                showDialogue();
            }
        }

        // 启动
        
        // 背景音乐管理系统
        const bgmSystem = {
            bgmPlayer: null,
            currentBGM: null,
            volume: 0.5,
            isMuted: false,
            
            // 场景到BGM的映射（已禁用）
            sceneToBGM: {},
            
            // 初始化
            init: function() {
                try {
                    this.bgmPlayer = document.getElementById('bgm-player');
                    if (this.bgmPlayer) {
                        this.volume = 0.5;
                        this.bgmPlayer.volume = this.volume;
                        this.setupControls();
                    } else {
                        console.warn('bgm-player元素不存在');
                    }
                } catch (error) {
                    console.error('bgmSystem.init()错误:', error);
                }
            },
            
            // 设置音量控制
            setupControls: function() {
                const muteBtn = document.getElementById('mute-btn');
                const volumeSlider = document.getElementById('volume-slider');
                
                if (muteBtn) {
                    muteBtn.addEventListener('click', () => {
                        this.toggleMute();
                    });
                }
                
                if (volumeSlider) {
                    volumeSlider.addEventListener('input', (e) => {
                        this.setVolume(e.target.value / 100);
                    });
                }
            },
            
            // 切换静音
            toggleMute: function() {
                this.isMuted = !this.isMuted;
                const muteBtn = document.getElementById('mute-btn');
                
                if (this.isMuted) {
                    this.bgmPlayer.volume = 0;
                    muteBtn.textContent = '🔇';
                } else {
                    this.bgmPlayer.volume = this.volume;
                    muteBtn.textContent = '🔊';
                }
            },
            
            // 设置音量
            setVolume: function(volume) {
                this.volume = volume;
                if (!this.isMuted) {
                    this.bgmPlayer.volume = volume;
                }
            },
            
            // 播放BGM（已禁用：音频文件暂不可用）
            play: function(bgmFile) {
                if (!bgmFile || bgmFile === this.currentBGM) return;
                this.currentBGM = bgmFile;
                // 不尝试加载音频文件，避免404错误
            },
            
            // 根据场景切换BGM
            switchBGM: function(sceneId) {
                if (!sceneId) return;
                
                // 检查是否有直接的BGM映射
                if (this.sceneToBGM[sceneId]) {
                    this.play(this.sceneToBGM[sceneId]);
                    return;
                }
                
                // 根据场景ID判断场景类型
                let bgmType = ''; // BGM已禁用
                
                if (sceneId.includes('battle') || sceneId.includes('fight')) {
                    bgmType = '';
                } else if (sceneId.includes('city') || sceneId.includes('chengdu') || 
                           sceneId.includes('jianye') || sceneId.includes('xuchang') ||
                           sceneId.includes('luoyang') || sceneId.includes('changan')) {
                    bgmType = '';
                } else if (sceneId.includes('explore') || sceneId.includes('map')) {
                    bgmType = '';
                } else if (sceneId.includes('year_report') || sceneId.includes('ending')) {
                    bgmType = '';
                } else if (sceneId.includes('ending')) {
                    bgmType = '';
                } else if (sceneId.includes('scholar')) {
                    bgmType = '';
                } else if (sceneId.includes('soldier')) {
                    bgmType = '';
                } else if (sceneId.includes('merchant')) {
                    bgmType = '';
                } else if (sceneId.includes('refugee')) {
                    bgmType = '';
                }
                
                this.play(bgmType);
            },
            
            // 停止播放
            stop: function() {
                this.bgmPlayer.pause();
                this.bgmPlayer.currentTime = 0;
                this.currentBGM = null;
            }
        };
        
    </script>
</body>
</html>
